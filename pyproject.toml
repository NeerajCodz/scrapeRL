[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scraperl-openenv"
version = "0.1.0"
description = "ScrapeRL OpenEnv-compatible environment package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
server = "server.app:main"

